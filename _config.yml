title: RARI — Legal
description: Privacy Policy and Terms of Service for the RARI mobile app
theme: jekyll-theme-cayman

# Convert .md → .html and serve at /path/ instead of /path.html
permalink: pretty

# Exclude internal repo files from the published site
exclude:
  - README.md
  - "*.gemspec"
  - vendor/

defaults:
  - scope:
      path: ""
    values:
      layout: default
